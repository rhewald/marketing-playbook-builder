# Pulls the cavaco.ai Navbar and Footer components (and site styles) from Webflow
# via DevLink into ./webflow, and commits them so the tool matches the main site.
# Needs the repository secret WEBFLOW_API_TOKEN (a Webflow Workspace API token).
name: DevLink export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [webflow.json, .github/workflows/devlink-export.yml]
  schedule:
    - cron: "17 9 * * *" # daily, picks up nav/footer edits made in Webflow

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export components
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: |
          if [ -z "$WEBFLOW_API_TOKEN" ]; then echo "::error::Add the WEBFLOW_API_TOKEN repository secret"; exit 1; fi
          npx -y @webflow/webflow-cli@latest devlink export --no-input --skip-update-check
      - name: Commit changes
        run: |
          git config user.name "devlink-bot"
          git config user.email "devlink-bot@users.noreply.github.com"
          git add webflow
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Sync Navbar and Footer from Webflow (DevLink)"
          git push
